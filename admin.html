<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>교사용 | 2027 수시지원 관리</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">S</span>
      <div>
        <div class="brand-title">2027 수시지원 관리</div>
        <div class="brand-subtitle">교사용 대시보드</div>
      </div>
    </div>
    <a class="link-button" href="./index.html">학생 입력</a>
  </header>

  <main class="container">
    <section id="loginPanel" class="login-wrap">
      <div class="card login-card">
        <span class="eyebrow">담임교사 전용</span>
        <h1>관리자 로그인</h1>
        <p>Firebase Authentication에 등록한 교사 계정으로 로그인합니다.</p>
        <label>이메일
          <input id="email" type="email" placeholder="teacher@school.kr" />
        </label>
        <label>비밀번호
          <input id="password" type="password" placeholder="비밀번호" />
        </label>
        <button id="loginBtn" class="primary large full">로그인</button>
        <div id="loginError" class="error-text"></div>
      </div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="dashboard-heading">
        <div>
          <span class="eyebrow">3학년 담임교사용</span>
          <h1>지원 현황 대시보드</h1>
          <p id="syncText">데이터를 불러오는 중입니다.</p>
        </div>
        <div class="heading-actions">
          <button id="exportBtn" class="secondary">CSV 내려받기</button>
          <button id="logoutBtn" class="ghost">로그아웃</button>
        </div>
      </div>

      <section class="stats-grid">
        <div class="stat-card">
          <span>입력 학생</span><strong id="studentCount">0</strong><small>명</small>
        </div>
        <div class="stat-card">
          <span>총 지원 건수</span><strong id="applicationCount">0</strong><small>건</small>
        </div>
        <div class="stat-card danger">
          <span>완전 중복 그룹</span><strong id="exactCount">0</strong><small>개</small>
        </div>
        <div class="stat-card warning">
          <span>학과 중복 그룹</span><strong id="deptCount">0</strong><small>개</small>
        </div>
      </section>

      <section class="card filters">
        <div class="filter-grid">
          <label>반
            <select id="filterClass">
              <option value="">전체 반</option>
              <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
              <option>6</option><option>7</option><option>8</option><option>9</option>
            </select>
          </label>
          <label>검색
            <input id="searchInput" placeholder="학생, 대학, 학과, 전형 검색" />
          </label>
          <label>보기
            <select id="viewMode">
              <option value="all">전체 지원</option>
              <option value="exact">🔴 완전 중복만</option>
              <option value="department">🟠 동일 대학·학과</option>
              <option value="university">🟡 동일 대학</option>
            </select>
          </label>
          <label>전형유형
            <select id="filterType">
              <option value="">전체</option>
              <option>학생부교과</option>
              <option>학생부종합</option>
              <option>논술</option>
              <option>실기/실적</option>
              <option>기타</option>
            </select>
          </label>
        </div>
      </section>

      <section class="dashboard-grid">
        <div class="card">
          <div class="section-head">
            <div>
              <h2>중복지원 탐지</h2>
              <p>같은 대학·학과·전형을 우선 확인하세요.</p>
            </div>
          </div>
          <div id="duplicateGroups" class="duplicate-list"></div>
        </div>

        <div class="card">
          <div class="section-head">
            <div>
              <h2>전체 지원 목록</h2>
              <p id="visibleCount">0건 표시</p>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>학생</th><th>대학</th><th>학과</th><th>전형유형</th><th>전형명</th><th>상태</th>
                </tr>
              </thead>
              <tbody id="applicationTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
